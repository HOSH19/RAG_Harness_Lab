[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-rag-harness"
version = "0.1.0"
description = "Local vLLM RAG practice stack with a hillclimb-style agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.55.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "numpy>=1.26.0",
  "streamlit>=1.40.0",
  "rank-bm25>=0.2.2",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]
# Optional: heavier local embeddings if torch installs cleanly on your machine
st = ["sentence-transformers>=3.3.0"]

[project.scripts]
rag-api = "rag.api:main"
rag-ingest = "rag.ingest:main"

[tool.setuptools]
packages = ["rag", "harness"]

[tool.setuptools.package-dir]
rag = "src/rag"
harness = "harness"

[tool.setuptools.package-data]
harness = ["cases/*.yaml"]