default_model: Qwen/Qwen2.5-7B-Instruct

models:
  Qwen/Qwen2.5-7B-Instruct:
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    notes: "Default for RTX 5000 Ada 16GB — solid quality/fit."
  Qwen/Qwen2.5-3B-Instruct:
    max_model_len: 8192
    gpu_memory_utilization: 0.75
    notes: "Faster / more headroom if 7B OOMs with long context."
  meta-llama/Llama-3.1-8B-Instruct:
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    notes: "Requires HF license acceptance + HF_TOKEN."

serving:
  host: 0.0.0.0
  port: 8000
  dtype: auto